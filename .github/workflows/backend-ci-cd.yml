name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "PersonalizedJira.sln"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "PersonalizedJira.sln"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PersonalizedJira.sln

      - name: Build
        run: dotnet build PersonalizedJira.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalizedJira.sln --configuration Release --no-build --verbosity normal
